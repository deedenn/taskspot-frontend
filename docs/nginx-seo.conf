# Пример внутри существующего server для taskspot.ru.
# Замените root фактическим каталогом dist. TLS, server_name и proxy для API
# остаются в основной конфигурации. Не дублируйте существующие location.
root /var/www/taskspot/frontend/dist;
index index.html;
charset utf-8;

# Проверяем исходный запрос: внутреннее открытие directory index
# не должно создавать цикл перенаправлений. Query string сохраняется.
if ($request_uri ~ "^(/(?:solutions|resources)/(?:[^?]*/)?)index\.html(?:\?|$)") {
    return 301 $1$is_args$args;
}

location = /solutions { return 301 /solutions/$is_args$args; }
location = /resources { return 301 /resources/$is_args$args; }
location = /resources/downloads { return 404; }
location = /resources/downloads/ { return 404; }

# Длинный prefix имеет приоритет перед /resources/. Никакого SPA fallback.
location ^~ /resources/downloads/ {
    types {
        text/csv csv;
        text/markdown md;
        text/html html;
    }
    default_type application/octet-stream;
    add_header Content-Disposition "attachment" always;
    add_header X-Robots-Tag "noindex" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# Существующие каталоги обслуживает index; nginx добавляет завершающий /.
# Отсутствующие страницы должны оставаться HTTP 404, не error_page /index.html.
location ^~ /solutions/ {
    try_files $uri $uri/ =404;
}
location ^~ /resources/ {
    try_files $uri $uri/ =404;
}

location = /sitemap.xml {
    default_type application/xml;
    try_files $uri =404;
}
location = /robots.txt {
    default_type text/plain;
    try_files $uri =404;
}
location ^~ /assets/ {
    try_files $uri =404;
}
location ^~ /brand/ {
    try_files $uri =404;
}

# Только остальные URL могут попасть в основной React Router.
# Более конкретные существующие API/proxy location должны быть сохранены.
location / {
    try_files $uri $uri/ /index.html;
}
